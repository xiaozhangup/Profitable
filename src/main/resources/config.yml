# 插件使用的语言文件
language: zh_cn

# 允许将 Vault 货币作为资产添加，并可从你的账户中提取或存入
vault-support: true

# 允许将 PlayerPoints 货币作为资产添加，并可从你的账户中提取或存入
player-points-support: true

colors: # 允许自定义命令输出和图表的颜色
  # 价格上涨时使用的颜色（十六进制）
  bullish: "#8CD740"

  # 价格下跌时使用的颜色（十六进制）
  bearish: "#FA413B"

database:
  # note: per-world data feature removed; plugin always uses server-wide shared data
  data-per-world: false

  # (0)-SQLite (1)-MySQL
  database-type: 0

  mysql:
    host:
    port:
    database:
    username:
    password:
    options: "?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true"

exchange:
  fees: # 固定费用: 23    百分比费用: 23%
    # 从钱包取钱时收取的费用
    withdrawal-fees: 0
    # 向钱包存钱时收取的费用
    deposit-fees: 0

  commodities:
    fees: # 固定费用: 23    百分比费用: 23%
      # 与其他订单立即成交时收取的费用
      taker-fees: 0
      # 向订单簿中添加订单时收取的费用
      maker-fees: 0

      # 使用实体认领标签时收取的费用（仅限固定费用）
      entity-claiming-fees: 0

    # 当进行交易时，大宗商品会在账户的交付位置生成实体物品（若为 false 则直接将大宗商品添加到钱包）
    physical-delivery: false

    # 允许从钱包中提取大宗商品用于交易
    take-wallet: true

    # 允许从背包中提取物品用于交易
    take-inventory: true

    # 允许从世界中提取已认领的实体用于交易
    take-world: true

    # 说明：大宗商品是以散装形式交易的原材料且可互换的物品，通常会被加工为其他产品
    #       作物和建筑材料也可以是大宗商品：
    #
    #       IRON 在现实生活中是大宗商品
    #             - 所有铁锭质量相同，因此可以互换（可替代/Fungible） v
    #             - 以大批量交易（散装交易/Traded in Bulk） v
    #             - 通常从地里开采（原材料/Raw material） v
    #
    #       DIAMOND HELMET（钻石头盔）不是大宗商品
    #             - 附魔、耐久和装饰会让每一个都独一无二（不可替代/Non-Fungible） x
    #             - 通常一次只交易一个（非散装） x
    #             - 成品（非原材料） x
    #
    #     不过这仅仅是建议，你可以按照自己的想法来使用这个插件。
    #
    generation:
      # 通过白名单/黑名单，在每个世界中为大宗商品自动生成资产
      active: true

      # 启用白名单并禁用物品黑名单
      item-whitelisting: true
      commodity-item-whitelist:
        - minecraft:COAL
        - minecraft:CHARCOAL
        - minecraft:IRON_INGOT
        - minecraft:COPPER_INGOT
        - minecraft:GOLD_INGOT
        - minecraft:NETHERITE_SCRAP
        - minecraft:AMETHYST_SHARD
        - minecraft:DIAMOND
        - minecraft:NETHER_QUARTZ
        - minecraft:EMERALD
        - minecraft:LAPIS_LAZULI
        - minecraft:GLOWSTONE_DUST
        - minecraft:REDSTONE
        - minecraft:WHEAT
        - minecraft:EGG
        - minecraft:APPLE
        - minecraft:MELON_SLICE
        - minecraft:PUMPKIN
        - minecraft:SWEET_BERRIES
        - minecraft:GLOW_BERRIES
        - minecraft:CHORUS_FRUIT
        - minecraft:CARROT
        - minecraft:POTATO
        - minecraft:POISONOUS_POTATO
        - minecraft:BEETROOT
