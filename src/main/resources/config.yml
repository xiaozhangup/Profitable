        - minecraft:PRISMARINE_SHARD
        - minecraft:PRISMARINE_CRYSTALS
        - minecraft:NAUTILUS_SHELL
        - minecraft:HEART_OF_THE_SEA
        - minecraft:BLAZE_ROD
        - minecraft:BREEZE_ROD
